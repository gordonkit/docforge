name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The integration tests export a real DOCX and render a preview, so they need Pandoc,
      # LibreOffice and gordon-doc. DOCFORGE_REQUIRE_TOOLS makes a missing tool a failure
      # instead of a skipped test.
      - uses: ./.github/actions/install-tools
        timeout-minutes: 15
      - run: npm test
        env:
          DOCFORGE_REQUIRE_TOOLS: "1"
      - name: Install the packed tarball in a clean project
        run: npm run test:package
        env:
          DOCFORGE_REQUIRE_TOOLS: "1"
      - run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f docker/compose.yaml --profile cli build cli
      # The checkout belongs to the runner user, so the container runs as that user to write to /work.
      - name: Export the bundled example in the container
        run: >-
          docker compose -f docker/compose.yaml --profile cli run --rm --user "$(id -u):$(id -g)"
          cli export /work/examples/report.json --output /work/report.docx
      - name: Render preview pages in the container
        run: >-
          docker compose -f docker/compose.yaml --profile cli run --rm --user "$(id -u):$(id -g)"
          cli preview /work/examples/report.json --output-dir /work/report-preview --engine libreoffice
      - run: test -s report.docx && test -s report-preview/document.pdf && ls report-preview/pages/*.png

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run check
      - run: npm --prefix site audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site/dist/


  deploy-documentation:
    # Workers Static Assets (wrangler.jsonc, Worker "docforge"). Runs on pushes to main.
    # Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/deploy-site.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-documentation
      cancel-in-progress: false
    environment:
      name: cloudflare-workers-production
      url: https://docforge.gordonkit.com/
    env:
      # IndexNow key. Public by design: it is served as /<key>.txt (site/public), and the same key
      # is used on every GordonKit host.
      INDEXNOW_KEY: da3af665c0c1192dbb4aad92b7ef3c9f
    steps:
      # Only the Wrangler configuration and the IndexNow script are needed from the repository;
      # the site itself is the artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            wrangler.jsonc
            .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: site/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Before the deploy, so the live site still holds the previous fingerprints to compare with.
      - name: Plan IndexNow notification
        run: >-
          node .github/scripts/indexnow.mjs plan
          --host docforge.gordonkit.com --dist site/dist
          --key "$INDEXNOW_KEY" --out "$RUNNER_TEMP/indexnow-plan.json"
      - name: Deploy documentation to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.157.0 deploy --config wrangler.jsonc
      - name: Notify IndexNow
        run: node .github/scripts/indexnow.mjs submit --plan "$RUNNER_TEMP/indexnow-plan.json"
