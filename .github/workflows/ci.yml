name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The integration tests export a real DOCX and render a preview, so they need Pandoc,
      # LibreOffice and gordon-doc. DOCFORGE_REQUIRE_TOOLS makes a missing tool a failure
      # instead of a skipped test.
      - name: Install Pandoc, LibreOffice and gordon-doc
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          # The Pandoc 3.1.3 that Ubuntu 24.04 packages drops footnotes from HTML input, so
          # install the tested release from pandoc's own GitHub release, checked by digest.
          PANDOC_VERSION: "3.13"
          PANDOC_SHA256: 7e3736f255090296ca5d1a14291a76b9b3c43cd385011b1621a4d0c16091a70f
        run: |
          curl --fail --silent --show-error --location --retry 3 --output pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  pandoc.deb" | sha256sum --check
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends ./pandoc.deb libreoffice-writer
          rm pandoc.deb
          pipx install "gordon-doc-converter[images]==1.0.0"
          pandoc --version | head -n 1
          gordon-doc version
      - run: npm test
        env:
          DOCFORGE_REQUIRE_TOOLS: "1"
      - run: npm audit --audit-level=high

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run check
      - run: npm --prefix site audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site/dist/


  deploy-documentation:
    # Workers Static Assets (wrangler.jsonc, Worker "docforge"). Runs on pushes to main.
    # Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/deploy-site.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-documentation
      cancel-in-progress: false
    environment:
      name: cloudflare-workers-production
      url: https://docforge.gordonkit.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: site/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Deploy documentation to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.157.0 deploy --config wrangler.jsonc
