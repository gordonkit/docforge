version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      # The project targets Node.js 24 (package.json engines); move to a new major by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directories:
      - /
      - /site
    schedule:
      interval: monthly
